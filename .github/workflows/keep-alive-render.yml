name: keep-alive-render

on:
  schedule:
    - cron: '*/6 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API no Render
        run: curl -sS -o /dev/null -w "HTTP %{http_code}\n" https://gerenciador-estoque-api-q7fs.onrender.com/api/dashboard/dia || true